name: Python tests and static checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
          python -m pip check
      - name: Python compilation and tests
        run: |
          python -m compileall -q agents neoantigen_predictor cli.py simulator.py enrichment.py
          python -m pytest -q
          ruff check --select E9,F63,F7,F82 .
      - name: Browser JavaScript syntax
        run: |
          node --check web/app.js
          node --test tests/browser.test.cjs
      - name: Packaging smoke test
        run: immunopeptidome-neoantigen-engine audit --task-id CI --target DEMO --primary 1 --secondary 1 --status NOMINAL
