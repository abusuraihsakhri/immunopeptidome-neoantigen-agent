[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immunopeptidome-neoantigen-engine"
version = "2.0.1"
description = "Generic audit-rule demonstration and experimental neoantigen workflow scaffolding"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
immunopeptidome-neoantigen-engine = "neoantigen_predictor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/immunopeptidome-neoantigen-agent"
Repository = "https://github.com/abusuraihsakhri/immunopeptidome-neoantigen-agent"

[tool.setuptools]
packages = ["agents", "neoantigen_predictor"]
py-modules = ["cli", "enrichment", "simulator", "neoantigen_predictor_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
